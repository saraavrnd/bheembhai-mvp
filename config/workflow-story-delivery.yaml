workflow: story-delivery
version: 1
category: Software Delivery
description: End-to-end governed story delivery — design, tests, implementation, verification, review, and PR.
start: story-design
steps:
  - id: story-design
    skill: story-design
    model: high   # per-step model (backend-enforced)
    label: Design the story
    deadline: 900
    "on":
      completed: test-creator
      changes_requested: story-design
      escalation_required: tech-design
      # A BLOCK verdict (design found a real problem) loops back with the
      # failure hand-off — policy-governed gates this for a human review.
      # Visit cap (BB_MAX_STEP_VISITS) breaks a runaway loop.
      BLOCK: story-design
  - id: tech-design
    skill: tech-design
    model: high   # per-step model (backend-enforced)
    label: Revisit the architecture
    deadline: 900
    "on":
      completed: story-design
  - id: test-creator
    skill: test-creator
    model: low   # per-step model (backend-enforced)
    label: Write the tests
    deadline: 900
    "on":
      completed: implement
  - id: implement
    skill: implement
    model: medium   # per-step model (backend-enforced)
    label: Build it
    deadline: 1800
    "on":
      completed: test-verify
  - id: test-verify
    skill: test-verify
    model: low   # per-step model (backend-enforced)
    label: Verify the tests pass
    deadline: 900
    "on":
      completed: code-review
      # A failed honest-green check sends the story back to implementation. Routing lives
      # in the workflow (backend-authoritative), not in what the agent names — the agent
      # only reports the BLOCK verdict; the workflow decides where it goes.
      BLOCK: implement
  - id: code-review
    skill: code-review
    model: medium   # per-step model (backend-enforced)
    label: Review the code
    deadline: 900
    "on":
      completed: pr-create
      changes_requested: implement
  - id: pr-create
    skill: pr-create
    model: low   # per-step model (backend-enforced)
    label: Open the pull request
    deadline: 600
    "on":
      completed: DONE
