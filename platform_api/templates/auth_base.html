<!DOCTYPE html>
<html lang="en" data-theme="semidark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BheemBhai — {% block title %}Platform{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #2c3e50;
            display: flex; align-items: center; justify-content: center;
        }
        .auth-wrapper {
            width: 100%; max-width: 440px;
            padding: 0 20px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .auth-card-header {
            background: #1a3a5c;
            padding: 32px 32px 24px;
            text-align: center;
        }
        .auth-card-header .brand-icon {
            font-size: 36px; margin-bottom: 8px;
        }
        .auth-card-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px; font-weight: 600;
            color: #ffffff; line-height: 1.4;
        }
        .auth-card-header .caption {
            font-size: 13px; color: rgba(255,255,255,0.65);
            margin-top: 6px;
        }
        .auth-card-body {
            padding: 32px;
            background: #fff;
            color: #2c3e50;
        }
        .auth-footer {
            text-align: center; padding: 16px 32px 24px;
            font-size: 12px; color: #94a3b8;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-card-header">
                <div class="brand-icon">🐝</div>
                <h1>{% block auth_heading %}BheemBhai{% endblock %}</h1>
                {% block auth_caption %}{% endblock %}
            </div>
            <div class="auth-card-body">
                {% block content %}{% endblock %}
            </div>
        </div>
        <div class="auth-footer">
            BheemBhai Platform &copy; 2026
        </div>
    </div>
</body>
</html>
