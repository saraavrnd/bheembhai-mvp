<!-- Workflows tab body (project workspace): category rail → workflow-card
     grid → recent-runs table. Data: GET /api/projects/{pid}/workflow-catalog.

     window.BBCatalog.activate() re-fetches on every tab activation (in-flight
     counts move); the first call is deferred until the tab opens. Category
     selection filters client-side and deep-links via ?cat=<id>. -->
<style>
    /* ── Workflow card grid ── */
    .bb-wf-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
        gap: 14px;
    }
    .bb-wf-card {
        border: 1px solid #eee5d8; border-radius: 8px; padding: 14px 16px;
        background: #fff; display: flex; flex-direction: column; gap: 7px;
    }
    .bb-wf-card-head { display: flex; align-items: center; gap: 8px; }
    .bb-wf-name {
        margin: 0; font-size: 15px; font-weight: 600; color: #2a2a3a;
        flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .bb-wf-id {
        font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8a7a6a;
    }
    .bb-wf-desc {
        font-size: 12.5px; color: #5a5a6e; line-height: 1.45;
        overflow: hidden; text-overflow: ellipsis;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        min-height: 17px;
    }
    .bb-wf-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .bb-wf-tag {
        font-size: 10.5px; font-weight: 600; color: #5a5a6e;
        background: #f0ebe0; border-radius: 4px; padding: 2px 8px;
    }
    .bb-state-pill.inflight { border: 1px solid #e07b5a; color: #b34d2c; }
    .run-state-dot.paused { background: #e07b5a; }

    /* ── Card last-run line ── */
    .bb-wf-last {
        display: flex; align-items: center; gap: 6px;
        font-size: 12px; color: #6e7681;
        border-top: 1px solid #f5f0e8; padding-top: 8px;
    }
    .bb-wf-last-state { font-weight: 600; }
    .bb-wf-last-story {
        font-family: 'JetBrains Mono', monospace; font-size: 11px;
        color: #8b3a2a; font-weight: 600;
    }
    .bb-wf-last-time { margin-left: auto; font-size: 11px; color: #8a7a6a; }

    /* ── Card actions ── */
    .bb-wf-actions { display: flex; gap: 8px; margin-top: 2px; }
    .bb-wf-actions .btn { font-size: 12px; }

    /* ── Recent-runs table action link ── */
    .bb-rr-action { font-size: 12px; font-weight: 600; white-space: nowrap; }
    .bb-rr-action.review { color: #b34d2c; }
    .bb-rr-sub { font-size: 11.5px; color: #8a7a6a; margin-top: -6px; margin-bottom: 10px; }
</style>

<div class="row">
    <div class="col-3">
        {% include "_catalog_rail.html" %}
    </div>
    <div class="col-9">
        <div class="d-flex justify-content-between align-items-center mb-10">
            <h4 class="mb-0" id="bb-catalog-title"><i class="fa fa-sitemap me-2"></i>All workflows</h4>
            <button class="btn btn-primary btn-sm" id="bb-new-wf" style="display:none;">
                <i class="fa fa-plus"></i> New workflow
            </button>
        </div>
        <div id="bb-wf-grid"></div>

        <div class="box mt-20">
            <div class="box-header with-border">
                <h4 class="box-title"><i class="fa fa-history me-2"></i>Recent runs</h4>
            </div>
            <div class="box-body">
                <p class="bb-rr-sub" id="bb-rr-sub"></p>
                <div id="bb-recent-runs"></div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    let data = null;
    let selectedCat = '';   // "" = All workflows
    let fetching = false;   // concurrent double-activation guard

    window.BBCatalog = { activate: activate };

    // "+ New workflow" → Configuration → Workflows panel (PM-only; the
    // button is hidden for non-PMs). The panel's loadWorkflows() handles the
    // rest — no new modal (product decision).
    document.getElementById('bb-new-wf').addEventListener('click', function () {
        const url = new URL(window.location);
        url.searchParams.set('tab', 'config');
        url.searchParams.set('sub', 'workflows');
        window.location.href = url.toString();
    });

    function activate() {
        if (fetching) return;
        fetching = true;
        fetch('/api/projects/' + window.BB_PROJECT_ID + '/workflow-catalog', { headers: authHeaders() })
            .then(r => r.json())
            .then(d => {
                data = d;
                const params = new URLSearchParams(window.location.search);
                if (params.get('cat') !== null) selectedCat = params.get('cat');
                renderAll();
            })
            .catch(() => {
                document.getElementById('bb-wf-grid').innerHTML =
                    '<p class="text-danger">Failed to load the workflow catalog.</p>';
            })
            .finally(() => { fetching = false; });
    }

    function renderAll() {
        const wfs = data.workflows || [];
        const allInFlight = wfs.reduce((n, w) => n + (w.in_flight || 0), 0);
        const items = [{ id: '', name: 'All workflows', workflow_count: wfs.length, in_flight: allInFlight }]
            .concat((data.categories || []).map(c => ({
                id: c.id, name: c.name,
                workflow_count: c.workflow_count, in_flight: c.in_flight,
            })));

        if (window.BBCatalogRail) {
            window.BBCatalogRail.render(items, selectedCat, function (catId) {
                selectedCat = catId;
                const url = new URL(window.location);
                if (catId) url.searchParams.set('cat', catId);
                else url.searchParams.delete('cat');
                window.history.replaceState({}, '', url);
                renderMain();
            });
        }
        renderMain();
    }

    function renderMain() {
        const wfs = data.workflows || [];
        const cat = (data.categories || []).find(c => c.id === selectedCat) || null;
        const visible = selectedCat ? wfs.filter(w => w.category_id === selectedCat) : wfs;

        document.getElementById('bb-catalog-title').innerHTML =
            '<i class="fa fa-sitemap me-2"></i>' + esc(cat ? cat.name : 'All workflows');

        // "+ New workflow" jumps to Configuration → Workflows, which is a
        // PM-only panel — hide the dead-end for non-PMs. Platform ADMINs
        // see it too (full project access without a membership row).
        document.getElementById('bb-new-wf').style.display =
            (roleFor(window.BB_PROJECT_ID) === 'project_manager'
                || (window.BB.user && window.BB.user.platform_role === 'ADMIN')) ? '' : 'none';

        renderCards(visible);
        renderRecentRuns(visible);
    }

    function renderCards(wfs) {
        const el = document.getElementById('bb-wf-grid');
        if (!wfs.length) {
            el.innerHTML = `
                <div class="runs-empty">
                    <p class="mb-10"><i class="fa fa-sitemap" style="font-size:32px;color:#c5c5d0;"></i></p>
                    <p>${selectedCat
                        ? 'No workflows in this category yet.'
                        : 'No workflows in this project yet — a project manager can copy platform templates from the Configuration tab.'}</p>
                </div>`;
            return;
        }
        el.innerHTML = '<div class="bb-wf-grid">' + wfs.map(renderCard).join('') + '</div>';
        el.querySelectorAll('.bb-wf-start').forEach(btn => {
            btn.addEventListener('click', function () { createNewRun(this.dataset.wfId); });
        });
    }

    function renderCard(w) {
        const tint = (window.BBCatalogRail && window.BBCatalogRail.tint)
            ? window.BBCatalogRail.tint(w.category_name || '') : 0;
        const last = w.last_run;
        const lastLine = last
            ? '<span class="run-state-dot ' + esc(last.state) + '"></span>'
                + '<span class="bb-wf-last-state">' + esc(cap(last.state)) + '</span>'
                + '<span class="bb-wf-last-story">' + esc(last.story_id) + '</span>'
                + '<span class="bb-wf-last-time">' + esc(last.relative || '') + '</span>'
            : '<span class="run-state-dot pending"></span><span class="bb-wf-last-state">No runs yet</span>';
        const openHref = '/projects/' + window.BB_PROJECT_ID + '/workflows/' + w.id
            + (selectedCat ? '?cat=' + encodeURIComponent(selectedCat) : '');
        return `
            <div class="bb-wf-card">
                <div class="bb-wf-card-head">
                    <span class="bb-cat-dot bb-cat-dot-${tint}"></span>
                    <h5 class="bb-wf-name">${esc(w.name)}</h5>
                    ${w.in_flight ? '<span class="bb-state-pill inflight">' + w.in_flight + ' in flight</span>' : ''}
                </div>
                <div class="bb-wf-id">#${esc(w.id.substring(0, 8))} · v${esc(w.version)}</div>
                <div class="bb-wf-desc">${esc(w.description || 'No description')}</div>
                <div class="bb-wf-tags">
                    <span class="bb-wf-tag">${w.steps} steps</span>
                    <span class="bb-wf-tag">${w.policy_count} policies</span>
                    <span class="bb-wf-tag">${w.gate_count} gates</span>
                    <span class="bb-wf-tag">${esc(w.category_name || 'Uncategorised')}</span>
                </div>
                <div class="bb-wf-last">${lastLine}</div>
                <div class="bb-wf-actions">
                    <button class="btn btn-sm btn-primary bb-wf-start" data-wf-id="${esc(w.id)}">
                        <i class="fa fa-play"></i> Start run
                    </button>
                    <a class="btn btn-sm btn-outline-secondary" href="${openHref}">
                        Open <i class="fa fa-arrow-right"></i>
                    </a>
                </div>
            </div>`;
    }

    function renderRecentRuns(visibleWfs) {
        const cat = (data.categories || []).find(c => c.id === selectedCat) || null;
        document.getElementById('bb-rr-sub').textContent = cat
            ? 'Recent runs · ' + cat.name
            : 'Recent runs · Across every category in this project';

        const el = document.getElementById('bb-recent-runs');
        const visibleIds = new Set(visibleWfs.map(w => w.id));
        const runs = (data.recent_runs || []).filter(r => !selectedCat || visibleIds.has(r.workflow_id));

        if (!runs.length) {
            el.innerHTML = '<p class="text-muted mb-0">No runs yet for this project.</p>';
            return;
        }

        el.innerHTML = `
            <div class="table-responsive">
                <table class="runs-table">
                    <thead>
                        <tr>
                            <th>Run</th>
                            <th>Workflow</th>
                            <th>State</th>
                            <th>Updated</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${runs.map(r => renderRecentRow(r)).join('')}
                    </tbody>
                </table>
            </div>`;

        el.querySelectorAll('tr[data-run-id]').forEach(row => {
            row.addEventListener('click', function () {
                window.location.href = '/projects/' + window.BB_PROJECT_ID + '/runs/' + this.dataset.runId;
            });
        });
        // The action link navigates the same way — stop the row handler from
        // firing twice.
        el.querySelectorAll('.bb-rr-action').forEach(a => {
            a.addEventListener('click', function (e) { e.stopPropagation(); });
        });
    }

    function renderRecentRow(r) {
        const stateHtml = r.needs_review
            ? '<span class="run-state-inline"><span class="run-state-dot needs-review"></span>'
                + '<span style="color:#e07b5a;">Needs review</span></span>'
            : '<span class="run-state-inline"><span class="run-state-dot ' + esc(r.state) + '"></span>'
                + esc(cap(r.state)) + '</span>';
        const action = r.needs_review
            ? '<a class="bb-rr-action review" href="/projects/' + window.BB_PROJECT_ID + '/runs/' + esc(r.run_id) + '">Review →</a>'
            : '<a class="bb-rr-action" href="/projects/' + window.BB_PROJECT_ID + '/runs/' + esc(r.run_id) + '">View →</a>';
        return `
            <tr data-run-id="${esc(r.run_id)}">
                <td class="story-col">
                    <div class="story-id">${esc(r.story_id)}</div>
                    <div class="story-title">#${esc(r.run_id.substring(0, 8))}</div>
                </td>
                <td>${esc(r.workflow_name)}</td>
                <td>${stateHtml}</td>
                <td class="updated-col">${esc(r.updated || '')}</td>
                <td class="text-end">${action}</td>
            </tr>`;
    }

    function cap(s) {
        if (!s) return '';
        return s.charAt(0).toUpperCase() + s.slice(1);
    }
})();
</script>
