services:
  # ── Data layer ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bheembhai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bheembhai}
      POSTGRES_DB: ${POSTGRES_DB:-bheembhai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bheembhai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Application layer ──────────────────────────────────────
  platform-api:
    build:
      context: .
      dockerfile: platform_api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: &app-env
      # ── Defaults when .env doesn't have a value ──────────────
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://bheembhai:bheembhai@postgres:5432/bheembhai}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-true}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-cognito}
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_REGION: ${S3_REGION:-us-east-1}
      SECURE_STORAGE_BACKEND: ${SECURE_STORAGE_BACKEND:-env}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      ENGINE_ID: ${ENGINE_ID:-engine-1}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app  # live-reload source during dev
    command: uvicorn platform_api.main:app --host 0.0.0.0 --port 8000 --reload

  engine-service:
    build:
      context: .
      dockerfile: engine_service/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn engine_service.main:app --host 0.0.0.0 --port 8001 --reload

volumes:
  pgdata:
