[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bheembhai-shared"
version = "0.1.0"
description = "BheemBhai shared models, protocols, and providers"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "boto3>=1.36,<2.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "httpx>=0.28,<1.0",
    "python-json-logger>=3.0,<4.0",
]

[project.optional-dependencies]
azure = [
    "azure-storage-blob>=12.0,<13.0",
    "azure-keyvault-secrets>=4.0,<5.0",
]
vault = ["hvac>=2.0,<3.0"]
minio = ["minio>=7.0,<8.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.28,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
